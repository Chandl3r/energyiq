<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supporto - EnergyIQ</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Sora:wght@700;800&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #080808;
      color: #f5f5f5;
      font-family: 'DM Sans', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 500px;
      width: 90%;
      background-color: #111111;
      border: 1px solid #1f1f1f;
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .icon {
      width: 64px;
      height: 64px;
      border-radius: 20px;
      background-color: #1c1503;
      border: 2px solid rgba(245, 158, 11, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      font-size: 28px;
    }
    h1 {
      font-family: 'Sora', sans-serif;
      font-weight: 800;
      margin: 0 0 10px;
      font-size: 26px;
    }
    p {
      color: #9ca3af;
      line-height: 1.6;
      margin: 0 0 30px;
      font-size: 15px;
    }
    .email-box {
      background-color: #080808;
      border: 1px solid #f59e0b40;
      border-radius: 12px;
      padding: 15px;
      font-size: 18px;
      font-weight: 700;
      color: #f59e0b;
      margin-bottom: 30px;
      word-break: break-all;
    }
    a {
      color: #f59e0b;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="icon">⚡</div>
    <h1>Supporto EnergyIQ</h1>
    <p>Hai problemi con l'app, il login o il caricamento delle tue bollette? Siamo qui per aiutarti. Contattaci direttamente via email:</p>
    
    <div class="email-box">
      <a href="mailto:marco.vinci84@gmail.com">marco.vinci84@gmail.com</a>
    </div>

    <p style="font-size: 13px; margin-bottom: 0;">
      Il nostro team ti risponderà il prima possibile.<br><br>
      <a href="/">&larr; Torna alla Home dell'App</a>
    </p>
  </div>

</body>
</html>
